# wasm-bindgen-rayon でスレッドを使うための設定。ネイティブのビルドに効かないよう、wasm32 のターゲットに限る。
# build-std はここに書くとネイティブのビルドにも効いてしまうので、mise の build:wasm タスクで -Z build-std として渡す
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+simd128",
  "-C", "link-arg=--shared-memory",
  # 線形メモリの上限は 2GiB にする。100 万人の街でも約 150MiB で足りる。
  # iOS の Safari では、上限の大きい共有メモリで WebAssembly.Memory が作れなかったという報告があるので、4GiB にはしない
  "-C", "link-arg=--max-memory=2147483648",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
]
