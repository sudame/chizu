name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# mise run が足りないツールを勝手に入れないようにし、各ジョブは install_args で入れたツールだけで動かす
env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-md:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rumdl
      - run: mise run lint:md

  lint-actions:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: jactionlint shellcheck
      - run: mise run lint:actions

  lint-rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
      # rust の版は mise.toml の設定で rust-toolchain.toml から読む
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust ripgrep
      - run: mise run lint:rust
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}

  test-rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
      # rust の版は mise.toml の設定で rust-toolchain.toml から読む
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust aqua:nextest-rs/nextest/cargo-nextest
      - run: mise run test:rust
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
      # ネイティブの registry の保存は 1 つのジョブだけが行う
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.registry-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-native-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  lint-wasm:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          registry: wasm
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust
      - run: mise run lint:wasm
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}

  lint-web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          registry: wasm
      # tsc が wasm-bindgen の作る型定義を読むので、WASM のビルドに要るものも入れる
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust github:wasm-bindgen/wasm-bindgen node pnpm biome
      - run: mise run lint:web
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}

  test-web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: node pnpm
      - run: mise run test:web

  test-wasm:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          registry: wasm
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust github:wasm-bindgen/wasm-bindgen node pnpm http:chrome-headless-shell
      - run: mise run test:wasm
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
      # wasm32 の registry の保存は 1 つのジョブだけが行う
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.registry-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-wasm-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  test-play:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bash と git だけで回るので、ツールは入れない
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - run: mise run test:play

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          registry: wasm
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust github:wasm-bindgen/wasm-bindgen node pnpm
      - run: mise run build
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}

  build-bench:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: rust
      - run: mise run build:bench
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
