[workspace]
resolver = "3"
members = [
  "crates/chizu-bench-wasm",
  "crates/chizu-cli",
  "crates/chizu-core",
  "crates/chizu-scenario",
  "crates/chizu-wasm",
]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
overflow-checks = true
# WASM が速く小さくなる。決めた理由は docs/design.md の 7.3 にある
lto = "fat"
codegen-units = 1

# ゴールデンのテストは毎 tick 状態ハッシュをとるので、テストも最適化して回す。
# dev の profile なので、overflow-checks と debug-assertions は有効なままである。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
