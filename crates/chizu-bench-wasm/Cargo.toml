[package]
name = "chizu-bench-wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# ブラウザで性能を測るための WASM。画面のアプリには入れず、mise の bench:wasm からだけ使う
[lib]
crate-type = ["cdylib"]

[dependencies]
chizu-scenario = { path = "../chizu-scenario" }
# wasm-bindgen-cli は mise.toml で同じ版を入れる。版を変えるときは chizu-wasm とそろえる
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# バンドラーを通さず、ブラウザでそのまま読むので no-bundler にする
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
