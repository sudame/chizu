[package]
name = "chizu-wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
chizu-core = { path = "../chizu-core" }
rayon = "1.11"
# wasm-bindgen-cli は mise.toml で同じ版を入れる。版を変えるときは両方そろえる
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1.3.0"
