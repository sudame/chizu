[settings]
# rust の版は rust-toolchain.toml から読む。mise が RUSTUP_TOOLCHAIN を立てるので、ここで別の版を書くとファイルより優先されてしまう
idiomatic_version_file_enable_tools = ["rust"]

[tools]
jactionlint = "2.4.0"
ripgrep = "15.2.0"
rumdl = "0.3.2"
shellcheck = "0.11.0"

[tasks."lint:md"]
run = "rumdl check ."

[tasks."lint:actions"]
run = "jactionlint"

[tasks."lint:rust"]
# cargo は clippy.toml の変更を確実には拾わない。chizu-core だけ消して毎回検査し直す
run = [
  "cargo fmt --all --check",
  "cargo clean --package chizu-core",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "scripts/check-no-float.sh",
]

[tasks.lint]
depends = ["lint:md", "lint:actions", "lint:rust"]

[tasks."test:rust"]
run = "cargo test --workspace"

[tasks.test]
depends = ["test:rust"]
