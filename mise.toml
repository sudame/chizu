[settings]
# rust の版は rust-toolchain.toml から読む。mise が RUSTUP_TOOLCHAIN を立てるので、ここで別の版を書くとファイルより優先されてしまう
idiomatic_version_file_enable_tools = ["rust"]

[tools]
biome = "2.6.4"
jactionlint = "2.4.0"
node = "26.13.0"
pnpm = "12.16.1"
ripgrep = "15.2.0"
rumdl = "0.3.2"
shellcheck = "0.11.0"
# crates/chizu-wasm の wasm-bindgen と同じ版にする
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"

# test:wasm で使うヘッドレスの Chrome。Chrome for Testing の配布物を版を固定して入れる
[tools."http:chrome-headless-shell"]
version = "156.0.8078.80"

[tools."http:chrome-headless-shell".platforms]
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-headless-shell-mac-arm64.zip" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-headless-shell-mac-x64.zip" }
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip" }

[tasks."lint:md"]
run = "rumdl check ."

[tasks."lint:actions"]
run = "jactionlint"

[tasks."lint:rust"]
# cargo は clippy.toml の変更を確実には拾わない。clippy.toml を持つクレートだけ消して毎回検査し直す。
# clippy.toml を持つクレートを足したら、cargo clean の --package にも足す
run = [
  "cargo fmt --all --check",
  "cargo clean --package chizu-core --package chizu-scenario",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "scripts/check-no-float.sh crates/chizu-core/src",
  "scripts/check-no-float.sh crates/chizu-scenario/src",
]

[tasks."lint:wasm"]
# lint:rust はネイティブでしか回らず、wasm32 に限った cfg の中を見ない。build:wasm と同じ条件で clippy を回す
run = "cargo clippy --package chizu-wasm --target wasm32-unknown-unknown -Z build-std=panic_abort,std -- -D warnings"

[tasks."install:web"]
dir = "web"
run = "pnpm install --frozen-lockfile"

[tasks."lint:web"]
# tsc は wasm-bindgen が作る型定義を読むので、先に WASM をビルドする
depends = ["install:web", "build:wasm"]
dir = "web"
run = ["biome check .", "pnpm exec tsc --noEmit"]

[tasks.lint]
depends = ["lint:md", "lint:actions", "lint:rust", "lint:wasm", "lint:web"]

[tasks."test:rust"]
run = "cargo test --workspace"

[tasks."test:web"]
depends = ["install:web"]
dir = "web"
run = "pnpm exec vitest run"

[tasks."test:wasm"]
description = "ビルドしたページをヘッドレスの Chrome で開き、スレッドつきの WASM が動くかと、保存と読み込みを確かめる"
depends = ["build:web"]
dir = "web"
run = ["node scripts/test-wasm.ts", "node scripts/test-save.ts"]

[tasks.test]
depends = ["test:rust", "test:web", "test:wasm"]

[tasks.bench]
description = "ネイティブのベンチマークを criterion で回す。CI では回さない"
run = "cargo bench --package chizu-scenario"

[tasks."build:bench"]
description = "ベンチマークをリリースのプロファイルでビルドだけする"
run = "cargo bench --workspace --no-run"

[tasks."build:wasm"]
# スレッドを使うには std を atomics つきでビルドし直す必要がある。wasm32 用の rustflags は .cargo/config.toml にある
run = [
  "cargo build --release --target wasm32-unknown-unknown --package chizu-wasm -Z build-std=panic_abort,std",
  "wasm-bindgen --target web --out-dir web/wasm target/wasm32-unknown-unknown/release/chizu_wasm.wasm",
]

[tasks."build:web"]
depends = ["install:web", "build:wasm"]
dir = "web"
run = "pnpm exec vite build"

[tasks.build]
depends = ["build:wasm", "build:web"]

[tasks.dev]
depends = ["install:web", "build:wasm"]
dir = "web"
run = "pnpm exec vite"
