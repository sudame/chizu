<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chizu</title>
    <style>
      /* 地図の部品の見た目は docs/map-style.md の「地図の部品」に従う。
         角丸は 3 段（ボタン 8、パネル 12、帯 16〜20）、余白は端から 12、部品どうし 8、字は 11、12、13、14、16 の 5 つに絞る */
      :root {
        --panel: #fff;
        --ink: #202124;
        --ink-sub: #5f6368;
        --line: #dadce0;
        --hover: #f1f3f4;
        --accent: #1a73e8;
        --accent-bg: #e8f0fe;
        --good: #188038;
        --bad: #b3261e;
        --shadow: 0 1px 2px rgb(60 64 67 / 30%), 0 2px 6px 2px rgb(60 64 67 / 15%);
        --r-button: 8px;
        --r-panel: 12px;
        --r-bar: 16px;
        --r-top: 20px;
        --edge: 12px;
        --gap: 8px;
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
        color: var(--ink);
      }
      [hidden] {
        display: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e6e3db;
      }
      button {
        font: inherit;
        color: inherit;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      svg.icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentcolor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .panel {
        box-sizing: border-box;
        padding: 12px 14px;
        color: var(--ink);
        background: var(--panel);
        border-radius: var(--r-panel);
        box-shadow: var(--shadow);
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      /* 字だけの小さなボタン */
      .chip,
      #save-open {
        min-height: 28px;
        padding: 0 12px;
        font-size: 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-button);
        cursor: pointer;
      }
      .chip:hover:not(:disabled),
      #save-open:hover:not(:disabled) {
        background: var(--hover);
      }
      .chip:disabled,
      #save-open:disabled {
        color: var(--ink-sub);
        cursor: default;
      }
      .chip[aria-pressed="true"] {
        color: var(--accent);
        background: var(--accent-bg);
        border-color: transparent;
        font-weight: 600;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      /* 道路名、地区名、施設名。地図の上に重ね、操作は下の地図に通す */
      #labels {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #map:not([data-tool="none"]) {
        cursor: crosshair;
      }

      /* 上の帯。いつも見るもの（日時、お金と収支、人口、速度）だけを置く。右上のフィードバックの分を空ける */
      #overlay {
        position: fixed;
        top: var(--edge);
        left: var(--edge);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--gap);
        max-width: calc(100vw - 68px);
        max-height: calc(100vh - 2 * var(--edge));
        box-sizing: border-box;
      }
      /* 欄が縦に積まれて足りなくなるときは、収支の欄だけが縮んでスクロールする */
      #overlay > * {
        flex-shrink: 0;
      }
      #hudbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0 12px;
        align-items: center;
        box-sizing: border-box;
        min-height: 40px;
        max-width: 100%;
        padding: 0 8px 0 16px;
        background: var(--panel);
        border-radius: var(--r-top);
        box-shadow: var(--shadow);
      }
      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 0 12px;
        align-items: center;
        margin: 0;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #hud-clock,
      #hud-population {
        font-weight: 600;
      }
      .vsep {
        width: 1px;
        height: 20px;
        background: var(--line);
      }
      #finance-toggle {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 8px;
        margin: 0 -8px;
        font-size: 14px;
        background: none;
        border: 0;
        border-radius: var(--r-button);
        cursor: pointer;
      }
      #finance-toggle:hover,
      #finance-toggle[aria-expanded="true"] {
        background: var(--hover);
      }
      #hud-money {
        font-weight: 600;
      }
      #hud-deficit {
        font-size: 12px;
        color: var(--good);
      }
      #hud-deficit[data-deficit="true"] {
        color: var(--bad);
      }
      #speeds {
        display: flex;
        gap: 2px;
        align-items: center;
      }
      #speeds button,
      #hud-toggle {
        min-width: 28px;
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
        color: var(--ink-sub);
        background: none;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
      }
      #speeds button:hover,
      #hud-toggle:hover {
        background: var(--hover);
      }
      #speeds button[aria-pressed="true"],
      #hud-toggle[aria-expanded="true"] {
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-bg);
      }
      #pause {
        padding: 0;
      }
      #pause svg,
      #hud-toggle svg {
        width: 16px;
        height: 16px;
        vertical-align: middle;
      }
      #hud-speed {
        padding: 0 8px;
        font-size: 12px;
        color: var(--ink-sub);
      }
      /* 開発者向けの表示。左下に小さく出す */
      #status {
        margin: 0;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--ink-sub);
        background: rgb(255 255 255 / 85%);
        border-radius: var(--r-button);
      }
      #status[data-state="error"] {
        font-size: 13px;
        font-weight: 600;
        color: var(--bad);
      }
      #dev-flag {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--bad);
      }
      /* 詳細の欄と収支は、上の帯の下に縦に積む */
      #hud-details,
      #finance {
        font-size: 13px;
      }
      #hud-details {
        width: max-content;
        max-width: 100%;
      }
      #finance {
        width: 280px;
        max-width: 100%;
        min-height: 6em;
        overflow-y: auto;
      }
      #overlay > #finance {
        flex-shrink: 1;
      }
      #hud-extra {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        margin: 0 0 8px;
      }
      #hud-extra > .extra-label {
        margin-right: 4px;
        font-size: 12px;
        color: var(--ink-sub);
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #city-numbers,
      #city-utilities {
        margin: 0;
      }
      #city-utility-hints {
        margin: 0;
        font-size: 12px;
        color: var(--ink-sub);
        white-space: pre-line;
      }
      #city-utilities.short {
        color: var(--bad);
        font-weight: 600;
      }
      #city {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 0 0 4px;
      }
      #overview {
        font-size: 13px;
      }
      #overview summary {
        cursor: pointer;
      }
      #overview p {
        margin: 2px 0 0;
      }
      #overview-parts {
        margin-top: 2px;
      }
      #demand {
        display: flex;
        gap: 0;
        align-items: flex-end;
      }
      /* 棒は 12px だが、押せる当たりは 32px 角ほどにする */
      #demand .slot-button {
        display: block;
        box-sizing: content-box;
        min-width: 12px;
        padding: 4px 10px;
        margin: -4px 0;
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        border-radius: var(--r-button);
      }
      #demand .slot-button:hover,
      #demand .slot-button[aria-pressed="true"] {
        background: var(--hover);
      }
      #demand .slot-button:focus-visible {
        outline: 2px solid var(--accent);
      }
      #demand-factors {
        margin: 0 0 6px;
        font-size: 12px;
      }
      #demand-factors .factors-head {
        margin: 0 0 2px;
        font-weight: 600;
      }
      #demand-factors .factor {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #demand-factors .factor > span:first-child {
        flex: 1;
      }
      #demand-factors .factor-bar {
        height: 6px;
        border-radius: 3px;
      }
      #demand-factors .plus .factor-bar {
        background: var(--good);
      }
      #demand-factors .minus .factor-bar {
        background: var(--bad);
      }
      #demand-factors .factor-value {
        min-width: 36px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #demand-factors .plus .factor-value {
        color: var(--good);
      }
      #demand-factors .minus .factor-value {
        color: var(--bad);
      }
      #demand .slot {
        display: block;
        position: relative;
        width: 12px;
        height: 40px;
        border-bottom: 1px solid #888;
        background: linear-gradient(transparent 19px, #888 19px, #888 20px, transparent 20px);
      }
      #demand .bar {
        position: absolute;
        left: 0;
        width: 12px;
        height: 0;
      }
      #demand .label {
        display: block;
        font-size: 11px;
        text-align: center;
      }
      #finance h2 {
        margin: 0 0 4px;
      }
      #finance.deficit h2 {
        color: var(--bad);
      }
      #finance h3 {
        margin: 8px 0 4px;
        font-size: 12px;
        color: var(--ink-sub);
      }
      #finance .finance-row {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #finance .finance-row > span:first-child {
        flex: 1;
      }
      #finance .finance-rate {
        min-width: 3.5em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #finance .finance-amount {
        min-width: 5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #finance .finance-net {
        justify-content: space-between;
        margin-top: 4px;
        padding-top: 4px;
        font-weight: 600;
        border-top: 1px solid var(--line);
      }
      #finance.deficit .finance-net {
        color: var(--bad);
      }
      #finance .finance-note {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--ink-sub);
      }

      /* 知らせ。上の帯の下に置き、狭い画面では下の道具の上へ積む */
      #notices {
        position: fixed;
        top: calc(var(--hudbar-h, 40px) + 24px);
        left: 440px;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        width: max-content;
        max-width: min(28em, calc(100vw - 520px));
      }
      #notice-toast,
      #save-notice,
      #milestone-notice,
      .save-alert {
        margin: 0;
        padding: 8px 16px;
        font-size: 13px;
        color: #5c3b00;
        background: #fef7e0;
        border-radius: var(--r-top);
        box-shadow: var(--shadow);
      }
      #milestone-notice {
        color: #0d652d;
        background: #e6f4ea;
      }
      /* 新しい知らせの札。数秒で消え、押すと一覧が開く */
      #notice-live {
        display: contents;
      }
      #notice-toast {
        display: block;
        font: inherit;
        text-align: left;
        border: 0;
        cursor: pointer;
      }
      /* 通知センターの一覧。右上の鐘の下に開く */
      #notice-panel {
        position: fixed;
        top: calc(var(--edge) + 32px + var(--gap));
        right: var(--edge);
        width: min(24em, calc(100vw - 2 * var(--edge)));
        max-height: calc(100vh - 2 * var(--edge) - 32px - var(--gap) - var(--bar-h, 64px));
        overflow-y: auto;
        font-size: 13px;
      }
      /* 開発用のフィードバックのボタンが鐘の下にあるときは、その下に開く */
      body:has(#feedback-open:not([hidden])) #notice-panel {
        top: calc(var(--edge) + 2 * (32px + var(--gap)));
      }
      #notice-empty {
        margin: 0;
        color: var(--ink-sub);
      }
      #notice-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .notice-item + .notice-item {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .notice-item > div {
        color: var(--ink-sub);
      }
      .notice-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap);
        margin-top: 6px;
      }
      #save-alerts {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .save-alert {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        justify-content: space-between;
      }
      #save-alerts button {
        padding: 0 8px;
        font-size: 13px;
        background: none;
        border: 0;
        cursor: pointer;
      }
      dialog {
        color: var(--ink);
        border: 0;
        border-radius: var(--r-panel);
        box-shadow: var(--shadow);
      }
      dialog::backdrop {
        background: rgb(32 33 36 / 30%);
      }
      #feedback textarea {
        box-sizing: border-box;
        width: min(28em, 100%);
        height: 6em;
      }

      /* 右上の小さな丸いボタン。鐘の下にフィードバックを縦に並べる */
      #corner {
        position: fixed;
        top: var(--edge);
        right: var(--edge);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        align-items: flex-end;
      }
      #notice-bell,
      #feedback-open {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        color: var(--ink-sub);
        background: var(--panel);
        border: 0;
        border-radius: 50%;
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      #notice-bell:hover,
      #feedback-open:hover {
        background: var(--hover);
      }
      #notice-bell:not([data-count="0"]) {
        color: var(--ink);
      }
      #notice-count {
        position: absolute;
        top: -4px;
        right: -4px;
        box-sizing: border-box;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        font-size: 11px;
        font-weight: 600;
        line-height: 16px;
        color: #fff;
        text-align: center;
        font-variant-numeric: tabular-nums;
        background: var(--bad);
        border-radius: 8px;
      }
      #dev-tools {
        max-width: 12em;
        pointer-events: auto;
      }
      #dev-tools button[aria-pressed="true"] {
        color: var(--accent);
        background: var(--accent-bg);
      }
      #dev-info {
        margin: 4px 0 0;
        padding: 2px 8px;
        font-size: 12px;
        color: var(--bad);
        background: rgb(255 255 255 / 90%);
        border-radius: var(--r-button);
      }
      #dev-info:empty {
        display: none;
      }
      #inspector {
        width: 248px;
        max-width: 100%;
        font-size: 13px;
      }
      #inspector header {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 600;
      }
      #inspector dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        margin: 8px 0 0;
        font-variant-numeric: tabular-nums;
      }
      #inspector dt {
        color: var(--ink-sub);
      }
      #inspector dd {
        margin: 0;
        text-align: right;
      }

      /* 下の中央。道具の帯、その上に開く 2 段目、選んだ道具の見積もりを縦に積む */
      #toolstack {
        position: fixed;
        bottom: var(--edge);
        left: 50%;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        align-items: center;
        max-width: calc(100vw - 2 * var(--edge));
        /* 帯と 2 段目の外は、下の地図を押せるようにする */
        pointer-events: none;
        transform: translateX(-50%);
      }
      #tool-status {
        /* 見積もりと結果の知らせは読むだけなので、下の地図を押せるようにする */
        pointer-events: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0 12px;
        justify-content: center;
        padding: 6px 14px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      #tool-status:not(:has(> :not(:empty))) {
        display: none;
      }
      #tool-info:empty,
      #tool-message:empty {
        display: none;
      }
      #toolbar {
        pointer-events: auto;
        display: flex;
        gap: 4px;
        align-items: center;
        box-sizing: border-box;
        padding: 8px;
        background: var(--panel);
        border-radius: var(--r-bar);
        box-shadow: var(--shadow);
      }
      #toolbar .tool {
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 48px;
        padding: 0;
        font-size: 11px;
        color: var(--ink-sub);
        background: none;
        border: 0;
        border-radius: var(--r-panel);
        cursor: pointer;
      }
      #toolbar .tool:hover {
        background: var(--hover);
      }
      #toolbar .tool[aria-pressed="true"] {
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-bg);
      }
      #toolbar .tool[aria-expanded="true"]:not([aria-pressed="true"]) {
        background: var(--hover);
      }
      .tool-menu {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 100%;
      }
      .tool-menu .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .tool-menu .row > span {
        min-width: 4.5em;
        font-size: 12px;
        color: var(--ink-sub);
      }
      .tool-menu .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 50%;
        vertical-align: baseline;
      }

      /* 鉄道の帯の中の路線の一覧。路線が多いときは縦にスクロールする */
      .lines {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 28vh;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        list-style: none;
      }
      .lines:empty {
        display: none;
      }
      .lines li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        align-items: center;
        font-size: 12px;
      }
      .lines .line-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }
      .lines .line-name {
        font-weight: 600;
      }
      .lines .chip {
        min-height: 24px;
        padding: 0 8px;
      }
      .lines .line-stops,
      .lines .line-note,
      .lines .line-warn {
        flex: 1 1 100%;
        color: var(--ink-sub);
      }
      .lines .line-warn {
        color: #d93025;
      }

      /* 右下。拡大縮小と、その上のレイヤーのボタン */
      #map-controls {
        position: fixed;
        right: var(--edge);
        bottom: var(--edge);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        align-items: flex-end;
      }
      .map-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        color: var(--ink-sub);
        background: var(--panel);
        border: 0;
        cursor: pointer;
      }
      .map-button:hover:not(:disabled) {
        background: var(--hover);
      }
      .map-button:disabled {
        color: var(--line);
        cursor: default;
      }
      #layers-open {
        border-radius: var(--r-button);
        box-shadow: var(--shadow);
      }
      #layers-open[aria-expanded="true"] {
        color: var(--accent);
        background: var(--accent-bg);
      }
      #zoom {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--panel);
        border-radius: var(--r-button);
        box-shadow: var(--shadow);
      }
      #zoom-out {
        border-top: 1px solid var(--line);
      }
      .layer-wrap {
        position: relative;
      }
      #layer-panel {
        position: absolute;
        right: calc(100% + var(--gap));
        bottom: 0;
        width: 208px;
      }
      #layers {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #layers button {
        display: flex;
        gap: 8px;
        align-items: center;
        height: 32px;
        padding: 0 8px;
        font-size: 13px;
        text-align: left;
        background: none;
        border: 0;
        border-radius: var(--r-button);
        cursor: pointer;
      }
      #layers button:hover {
        background: var(--hover);
      }
      #layers button[aria-pressed="true"] {
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-bg);
      }
      .layer-dot {
        width: 16px;
        height: 16px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 50%;
      }
      /* 主題図の凡例。レイヤーのボタンの左に浮かべ、パネルの中にも同じものを出す */
      .theme-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        margin: 0;
        padding: 0;
        font-size: 12px;
        list-style: none;
      }
      .theme-legend[hidden] {
        display: none;
      }
      #theme-legend {
        position: absolute;
        top: 0;
        right: calc(100% + var(--gap));
        box-sizing: border-box;
        width: max-content;
        max-width: calc(100vw - 2 * var(--edge) - 40px - var(--gap));
        min-height: 40px;
        padding: 6px 12px;
        background: var(--panel);
        border-radius: var(--r-panel);
        box-shadow: var(--shadow);
      }
      #layer-theme-legend {
        margin-top: 8px;
      }
      /* 凡例は押せる部品ではないので、下の地図への操作を妨げない。
         道具の 2 段目とレイヤーのパネルを開いているあいだは、重なるので隠す */
      #theme-legend {
        pointer-events: none;
      }
      body[data-layers-open] #theme-legend,
      body[data-menu-open] #theme-legend {
        display: none;
      }
      .theme-legend li {
        display: flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
      }
      .theme-sample {
        display: inline-block;
        box-sizing: border-box;
        width: 20px;
        height: 4px;
        border-radius: 2px;
        background: var(--c);
      }
      .theme-dash {
        background: repeating-linear-gradient(90deg, var(--c) 0 5px, var(--a, transparent) 5px 8px);
      }
      .theme-fill,
      .theme-hatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
      }
      .theme-hatch {
        background: repeating-linear-gradient(45deg, var(--a) 0 1.5px, var(--c) 1.5px 5px);
      }
      /* 需要の棒。真ん中の線が需要 0 で、正は右へ、負は左へ伸ばす */
      .theme-bar {
        position: relative;
        width: 40px;
        height: 10px;
        background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat;
        border-radius: 0;
      }
      .theme-bar::after {
        position: absolute;
        top: 1px;
        bottom: 1px;
        width: calc(var(--v) * 50%);
        background: var(--c);
        content: "";
      }
      .theme-bar[data-sign="pos"]::after {
        left: 50%;
      }
      .theme-bar[data-sign="neg"]::after {
        right: 50%;
      }
      #legend {
        margin-top: 8px;
        padding-top: 8px;
        font-size: 12px;
        border-top: 1px solid var(--line);
      }
      #legend-body {
        max-height: 40vh;
        overflow-y: auto;
      }
      #legend summary {
        cursor: pointer;
        font-weight: 600;
      }
      #legend h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }
      #legend ul {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #legend li {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #legend .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 1px solid rgb(0 0 0 / 40%);
      }
      #legend .swatch-icon {
        background: #555;
        border-radius: 2px;
      }

      /* 左下。縮尺の物差しと、開発者向けの状態 */
      #map-meta {
        position: fixed;
        bottom: var(--edge);
        left: var(--edge);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        align-items: flex-start;
        pointer-events: none;
      }
      #scale {
        padding: 4px 8px 6px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--panel);
        border-radius: var(--r-button);
        box-shadow: var(--shadow);
      }
      #scale [data-scale-line] {
        width: 100px;
        height: 4px;
        box-sizing: border-box;
        border: 1.5px solid var(--ink);
        border-top: 0;
      }

      #finance .finance-row button {
        width: 24px;
        height: 24px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-button);
        cursor: pointer;
      }
      #finance .finance-row button:hover {
        background: var(--hover);
      }

      #inspector-close {
        width: 24px;
        height: 24px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: var(--r-button);
        cursor: pointer;
      }
      #inspector-close:hover {
        background: var(--hover);
      }

      /* display を決めた部品も、hidden のときは隠す */
      .tool-menu[hidden],
      #feedback-open[hidden],
      #notice-toast[hidden],
      #notice-count[hidden],
      #notice-empty[hidden] {
        display: none;
      }

      /* 幅 900px 以下では、下の道具の帯が左下と右下の部品に届くので、部品を帯の上へ上げる */
      @media (max-width: 900px) {
        /* 下の部品（左下の隅の部品と道具の帯）の上までに収める */
        #overlay {
          max-height: calc(
            100vh - 2 * var(--edge) - var(--toolbar-h, 64px) - var(--meta-h, 66px) - var(--notices-h, 0px) -
              4 * var(--gap)
          );
        }
        #map-controls,
        #map-meta {
          bottom: calc(var(--bar-h, 64px) + var(--edge) + var(--gap));
        }
        /* 道具の 2 段目を開いているあいだは、隅の部品が 2 段目に重なるので隠す */
        body[data-menu-open] #map-controls,
        body[data-menu-open] #map-meta {
          visibility: hidden;
        }
        /* 上の帯が右の端まで届くので、通知センターの一覧は帯の下に開く */
        body #notice-panel {
          top: calc(var(--hudbar-h, 40px) + 2 * var(--edge) + var(--gap));
          max-height: calc(100vh - var(--hudbar-h, 40px) - 3 * var(--edge) - var(--bar-h, 64px));
        }
        body:has(#feedback-open:not([hidden])) #notice-panel {
          top: max(
            calc(var(--hudbar-h, 40px) + 2 * var(--edge) + var(--gap)),
            calc(var(--edge) + 2 * (32px + var(--gap)))
          );
        }
        /* 左下の部品の上へ積む */
        #notices {
          top: auto;
          right: 68px;
          bottom: calc(
            var(--toolbar-h, 64px) + var(--edge) + var(--gap) + var(--meta-h, 66px) + var(--gap)
          );
          left: var(--edge);
          width: auto;
          max-width: none;
        }
        /* 通知センターの一覧を開いているあいだも、隅の部品と知らせが一覧に重なるので隠す */
        body[data-notices-open] #map-controls,
        body[data-notices-open] #map-meta,
        body[data-notices-open] #notices,
        body[data-notices-open] #inspector,
        body[data-notices-open] #hud-details,
        body[data-layers-open] #notices,
        body[data-layers-open] #map-meta {
          visibility: hidden;
        }
        /* 狭い画面では浮かべた凡例が左下の部品と知らせに届くので、レイヤーのパネルの中の凡例だけにする */
        #theme-legend {
          display: none;
        }
      }
      /* 幅 640px 以下では、道具の帯を絵だけにし、上の帯は折り返す */
      @media (max-width: 640px) {
        #toolbar .tool {
          width: 44px;
        }
        #toolbar .tool span {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        #hudbar {
          padding: 4px 8px 4px 12px;
          border-radius: var(--r-bar);
        }
        .vsep {
          display: none;
        }
      }
      /* 幅 420px 以下では、道具が 8 つ並ぶ帯が折り返さないよう、ボタンを細くして間を詰める */
      @media (max-width: 420px) {
        #toolbar {
          gap: 2px;
        }
        #toolbar .tool {
          width: 38px;
        }
      }
    </style>
  </head>

    <canvas id="map" data-tool="none"></canvas>

    <div id="overlay">

      <p id="status" data-state="loading">WASM を読み込んでいる</p>
      <div id="scale">
        <div data-scale-label>100 m</div>
        <div data-scale-line></div>
      </div>
    </div>
    <div id="corner">
      <button type="button" id="notice-bell" data-map-panel data-count="0" aria-label="知らせ" title="知らせ" aria-controls="notice-panel" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-bell" /></svg><span id="notice-count" aria-hidden="true" hidden></span></button>
      <button type="button" id="feedback-open" data-map-panel aria-label="フィードバック" title="フィードバック" hidden><svg class="icon" aria-hidden="true"><use href="#i-chat" /></svg></button>
    </div>
    <div id="notice-panel" data-map-panel class="panel" hidden>
      <h2>知らせ</h2>
      <p id="notice-empty">いまの知らせはない</p>
      <ul id="notice-list"></ul>
    </div>
    <dialog id="feedback">
      <form method="dialog">
        <p>気づいたことを書く。画面、状態、これまでの操作の記録と一緒に保存する。</p>
        <textarea id="feedback-note"></textarea>
        <p id="feedback-result" aria-live="polite"></p>
        <button type="submit" class="chip" id="feedback-send">送る</button>
        <button type="submit" class="chip" value="close" formnovalidate>閉じる</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
