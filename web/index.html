<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chizu</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1f;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #map:not([data-tool="none"]) {
        cursor: crosshair;
      }
      #toolbar {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 4px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
        white-space: nowrap;
      }
      #toolbar button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #layers {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-top: 4px;
      }
      #layers button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #feedback-open {
        position: fixed;
        top: 8px;
        right: 8px;
      }
      #feedback textarea {
        width: 28em;
        height: 6em;
      }
      #dev-tools {
        position: fixed;
        top: 40px;
        right: 8px;
        max-width: 20em;
        text-align: right;
      }
      #dev-tools button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #dev-flag {
        margin: 0;
        font-size: 12px;
        font-weight: bold;
        color: #a33;
      }
      #dev-info {
        margin: 4px 0 0;
        font-size: 12px;
        color: #a33;
        background: rgb(255 255 255 / 85%);
      }
      #dev-info:empty {
        display: none;
      }
      #tool-info,
      #tool-message {
        min-width: 10em;
        font-size: 14px;
      }
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
      }
      #status,
      #city-numbers,
      #city-utilities {
        margin: 0;
      }
      #city {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 4px 0;
      }
      #city-utilities.short {
        color: #a31515;
        font-weight: bold;
      }
      #city-shortage {
        position: fixed;
        top: 8px;
        left: 520px;
        padding: 4px 8px;
        max-width: 24em;
        font-size: 13px;
        color: #7a1010;
        background: #ffe3a3;
        border: 1px solid #d49a00;
        border-radius: 4px;
      }
      @media (max-width: 900px) {
        #city-shortage {
          top: auto;
          right: 8px;
          bottom: 104px;
          left: 8px;
          max-width: none;
        }
      }
      #legend {
        position: fixed;
        right: 8px;
        bottom: 56px;
        max-width: 16em;
        padding: 4px 8px;
        font-size: 12px;
        background: rgb(255 255 255 / 90%);
        border-radius: 4px;
      }
      #legend summary {
        cursor: pointer;
        font-weight: bold;
      }
      #legend h3 {
        margin: 6px 0 2px;
        font-size: 12px;
      }
      #legend ul {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #legend li {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #legend .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 1px solid rgb(0 0 0 / 40%);
      }
      #legend .swatch-icon {
        background: #555;
        border-radius: 2px;
      }
      #demand {
        display: flex;
        gap: 4px;
        align-items: flex-end;
      }
      #demand .slot {
        position: relative;
        width: 12px;
        height: 40px;
        border-bottom: 1px solid #888;
        background: linear-gradient(transparent 19px, #888 19px, #888 20px, transparent 20px);
      }
      #demand .bar {
        position: absolute;
        left: 0;
        width: 12px;
        height: 0;
      }
      #demand .label {
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="map" data-tool="none"></canvas>
    <div id="overlay">
      <p id="status" data-state="loading">WASM を読み込んでいる</p>
      <canvas id="hud" width="480" height="96"></canvas>
      <p id="dev-flag" hidden>開発用の操作あり：再現不可</p>
      <div id="city">
        <div>
          <p id="city-numbers">建物 0 棟・住める世帯 0・職場の枠 0</p>
          <p id="city-utilities">電気 0 / 需要 0・水道 0 / 需要 0</p>
        </div>
        <div id="demand" title="区画の種類ごとの需要">
          <div><div class="slot"><div class="bar" style="background: #26f226"></div></div><div class="label">住</div></div>
          <div><div class="slot"><div class="bar" style="background: #4073f2"></div></div><div class="label">商</div></div>
          <div><div class="slot"><div class="bar" style="background: #f2cc33"></div></div><div class="label">工</div></div>
          <div><div class="slot"><div class="bar" style="background: #4dd9f2"></div></div><div class="label">オ</div></div>
        </div>
      </div>
      <div id="controls">
        <button type="button" id="pause">一時停止</button>
        <button type="button" data-speed="1">1 倍</button>
        <button type="button" data-speed="4">4 倍</button>
        <button type="button" data-speed="16">16 倍</button>
        <button type="button" data-speed="48">48 倍</button>
      </div>
      <div id="layers" title="データレイヤー"></div>
    </div>
    <div id="city-shortage" role="status" hidden></div>
    <div id="toolbar">
      <button type="button" data-tool="none" aria-pressed="true">見る</button>
      <button type="button" data-tool="road-Small" aria-pressed="false">道路 小</button>
      <button type="button" data-tool="road-Medium" aria-pressed="false">道路 中</button>
      <button type="button" data-tool="road-Large" aria-pressed="false">道路 大</button>
      <button type="button" data-tool="bulldoze" aria-pressed="false">ブルドーザ</button>
      <button type="button" data-tool="zone-Residential" aria-pressed="false">住宅</button>
      <button type="button" data-tool="zone-Commercial" aria-pressed="false">商業</button>
      <button type="button" data-tool="zone-Industrial" aria-pressed="false">工業</button>
      <button type="button" data-tool="zone-Office" aria-pressed="false">オフィス</button>
      <button type="button" data-tool="zone-Clear" aria-pressed="false">区画を消す</button>
      <button type="button" data-tool="service-PowerPlant" aria-pressed="false">発電所</button>
      <button type="button" data-tool="service-WaterPump" aria-pressed="false">浄水場</button>
      <button type="button" data-tool="buy" aria-pressed="false">土地を買う</button>
      <span id="tool-info"></span>
      <span id="tool-message" aria-live="polite"></span>
    </div>
    <details id="legend">
      <summary>凡例</summary>
      <div id="legend-body"></div>
    </details>
    <button type="button" id="feedback-open" hidden>フィードバック</button>
    <div id="dev-tools">
      <button type="button" data-tool="dev-walks" aria-pressed="false" hidden>歩く人を出す</button>
      <p id="dev-info"></p>
    </div>
    <dialog id="feedback">
      <form method="dialog">
        <p>気づいたことを書く。画面、状態、これまでの操作の記録と一緒に保存する。</p>
        <textarea id="feedback-note"></textarea>
        <p id="feedback-result" aria-live="polite"></p>
        <button type="submit" id="feedback-send">送る</button>
        <button type="submit" value="close" formnovalidate>閉じる</button>
      </form>
    </dialog>
    <style>
      /* 右下の凡例と重ならないよう、右上のフィードバックのボタンの下に置く */
      #inspector {
        position: fixed;
        right: 8px;
        top: 48px;
        min-width: 16em;
        padding: 4px 8px 8px;
        font-size: 14px;
        background: rgb(255 255 255 / 90%);
        border-radius: 4px;
      }
      #inspector[hidden] {
        display: none;
      }
      #inspector header {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        font-weight: bold;
      }
      #inspector dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        margin: 4px 0 0;
      }
      #inspector dt {
        color: #555;
      }
      #inspector dd {
        margin: 0;
        text-align: right;
      }
    </style>
    <aside id="inspector" hidden>
      <header>
        <span data-inspector-title aria-live="polite"></span>
        <button type="button" data-inspector-close aria-label="閉じる">×</button>
      </header>
      <dl data-inspector-rows></dl>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
