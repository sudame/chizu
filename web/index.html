<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chizu</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1f;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #map:not([data-tool="none"]) {
        cursor: crosshair;
      }
      #toolbar {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        align-items: center;
        width: max-content;
        max-width: calc(100vw - 16px);
        box-sizing: border-box;
        padding: 4px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
        white-space: nowrap;
      }
      #toolbar button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #layers {
        display: flex;
        gap: 4px;
        align-items: center;
        padding-left: 8px;
        border-left: 1px solid #888;
      }
      #layers button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      /* 右上の部品は、上の帯の下に積む。帯は幅が狭いと 2 行になるので、高さは --hudbar-h で測る */
      #feedback-open {
        position: fixed;
        top: calc(var(--hudbar-h, 30px) + 16px);
        right: 8px;
      }
      #feedback textarea {
        width: 28em;
        height: 6em;
      }
      #dev-tools {
        position: fixed;
        top: calc(var(--hudbar-h, 30px) + 48px);
        right: 8px;
        max-width: 14em;
        text-align: right;
      }
      #dev-tools button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #dev-flag {
        margin: 0;
        font-size: 12px;
        font-weight: bold;
        color: #a33;
      }
      #dev-info {
        margin: 4px 0 0;
        font-size: 12px;
        color: #a33;
        background: rgb(255 255 255 / 85%);
      }
      #dev-info:empty {
        display: none;
      }
      #tool-info,
      #tool-message {
        min-width: 10em;
        font-size: 14px;
      }
      /* 上の端の細い帯。いつも見るもの（日時、お金、速度とその操作）だけを置く */
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: calc(100vw - 16px);
        box-sizing: border-box;
      }
      #hudbar,
      #hud-details {
        padding: 2px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
      }
      #hudbar {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        align-items: center;
      }
      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 0 14px;
        margin: 0;
        font-size: 17px;
        color: #222;
        white-space: nowrap;
      }
      #hud [hidden] {
        display: none;
      }
      #hud-deficit {
        color: #b00020;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      #controls button,
      #hud-toggle {
        padding: 1px 6px;
        font-size: 12px;
      }
      /* 開発者向けの表示。小さく、控えめに出す */
      #status {
        margin: 0;
        font-size: 11px;
        color: #666;
      }
      #status[data-state="error"] {
        font-size: 13px;
        font-weight: bold;
        color: #a31515;
      }
      #hud-details {
        width: max-content;
        max-width: 100%;
        box-sizing: border-box;
        padding: 4px 8px;
      }
      #hud-details[hidden] {
        display: none;
      }
      #city-numbers,
      #city-utilities {
        margin: 0;
      }
      #city-utilities.short {
        color: #a31515;
        font-weight: bold;
      }
      #city {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 0 0 4px;
      }
      #notices {
        position: fixed;
        top: calc(var(--hudbar-h, 30px) + 16px);
        left: 390px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: max-content;
        max-width: min(24em, calc(100vw - 610px));
      }
      #city-shortage,
      #growth-notice,
      #save-notice,
      .save-alert {
        margin: 0;
        padding: 4px 8px;
        font-size: 13px;
        color: #7a1010;
        background: #ffe3a3;
        border: 1px solid #d49a00;
        border-radius: 4px;
      }
      #growth-notice button {
        display: block;
        margin-top: 4px;
        padding: 2px 8px;
        font: inherit;
        color: #fff;
        background: #b8620a;
        border: 1px solid #7a1010;
        border-radius: 4px;
        cursor: pointer;
      }
      #growth-notice button[hidden] {
        display: none;
      }
      #growth-notice button:hover {
        background: #9a5008;
      }
      #growth-notice button:focus-visible {
        outline: 2px solid #1a4fd6;
        outline-offset: 2px;
      }
      #city-shortage[hidden],
      #growth-notice[hidden],
      #save-notice[hidden] {
        display: none;
      }
      @media (max-width: 900px) {
        #notices {
          top: auto;
          right: 8px;
          bottom: calc(var(--toolbar-h, 48px) + 56px);
          left: 8px;
          width: auto;
          max-width: none;
        }
      }
      #save-alerts {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .save-alert {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        justify-content: space-between;
      }
      #save-alerts button {
        padding: 0 6px;
        font-size: 12px;
      }
      #legend {
        position: fixed;
        right: 8px;
        bottom: calc(var(--toolbar-h, 48px) + 8px);
        max-width: 16em;
        padding: 4px 8px;
        font-size: 12px;
        background: rgb(255 255 255 / 90%);
        border-radius: 4px;
      }
      #legend summary {
        cursor: pointer;
        font-weight: bold;
      }
      #legend h3 {
        margin: 6px 0 2px;
        font-size: 12px;
      }
      #legend ul {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #legend li {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #legend .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 1px solid rgb(0 0 0 / 40%);
      }
      #legend .swatch-icon {
        background: #555;
        border-radius: 2px;
      }
      #overview {
        font-size: 13px;
      }
      #overview summary {
        cursor: pointer;
      }
      #overview p {
        margin: 2px 0 0;
      }
      #overview-parts {
        margin-top: 2px;
      }
      #milestone-notice {
        position: fixed;
        bottom: calc(var(--toolbar-h, 48px) + 16px);
        left: 50%;
        transform: translateX(-50%);
        max-width: 24em;
        padding: 8px 16px;
        font-size: 14px;
        color: #0b4a1c;
        background: #c9f2d3;
        border: 1px solid #2c9a4a;
        border-radius: 4px;
      }
      #milestone-notice[hidden] {
        display: none;
      }
      @media (max-width: 900px) {
        /* 足りない知らせと同じ縦の並び（#notices）に積む */
        #milestone-notice {
          position: static;
          transform: none;
          max-width: none;
        }
      }
      #demand {
        display: flex;
        gap: 4px;
        align-items: flex-end;
      }
      #demand .slot {
        position: relative;
        width: 12px;
        height: 40px;
        border-bottom: 1px solid #888;
        background: linear-gradient(transparent 19px, #888 19px, #888 20px, transparent 20px);
      }
      #demand .bar {
        position: absolute;
        left: 0;
        width: 12px;
        height: 0;
      }
      #demand .label {
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="map" data-tool="none"></canvas>
    <div id="overlay">
      <div id="hudbar">
        <p id="hud">
          <span id="hud-clock">1 日目 00:00</span>
          <span id="hud-money">お金 0</span>
          <span id="hud-deficit" hidden></span>
          <span id="hud-speed">速度 1 倍</span>
        </p>
        <div id="controls">
          <button type="button" id="pause">一時停止</button>
          <button type="button" data-speed="0.25">0.25 倍</button>
          <button type="button" data-speed="0.5">0.5 倍</button>
          <button type="button" data-speed="1">1 倍</button>
          <button type="button" data-speed="4">4 倍</button>
          <button type="button" data-speed="16">16 倍</button>
          <button type="button" data-speed="48">48 倍</button>
        </div>
        <button type="button" id="hud-toggle" aria-controls="hud-details" aria-expanded="false">詳細<span aria-hidden="true"> ▸</span></button>
        <p id="status" data-state="loading">WASM を読み込んでいる</p>
        <p id="dev-flag" hidden>開発用の操作あり：再現不可</p>
      </div>
      <div id="hud-details" hidden>
        <div id="city">
          <div>
            <p id="city-numbers">建物 0 棟・住める世帯 0・職場の枠 0</p>
            <p id="city-utilities">電気 0 / 需要 0・水道 0 / 需要 0</p>
          </div>
          <div id="demand" title="区画の種類ごとの需要">
            <div><div class="slot"><div class="bar" style="background: #26f226"></div></div><div class="label">住</div></div>
            <div><div class="slot"><div class="bar" style="background: #4073f2"></div></div><div class="label">商</div></div>
            <div><div class="slot"><div class="bar" style="background: #f2cc33"></div></div><div class="label">工</div></div>
            <div><div class="slot"><div class="bar" style="background: #4dd9f2"></div></div><div class="label">オ</div></div>
          </div>
        </div>
        <details id="overview">
          <summary><span id="overview-population">人口 0</span>・<span id="overview-happiness">幸福度 0 / 100</span>・<span id="overview-remaining">次の段階まで</span></summary>
          <p id="overview-next"></p>
          <div id="overview-parts"></div>
        </details>
      </div>
    </div>
    <div id="notices">
      <div id="city-shortage" role="status" hidden></div>
      <div id="growth-notice" hidden>
        <div role="status"><strong id="growth-notice-head"></strong><div id="growth-notice-action"></div></div>
        <button type="button" id="growth-notice-jump" hidden></button>
      </div>
      <div id="milestone-notice" role="status" hidden></div>
    </div>
    <div id="toolbar">
      <button type="button" data-tool="none" aria-pressed="true">見る</button>
      <button type="button" data-tool="road-Small" aria-pressed="false">道路 小</button>
      <button type="button" data-tool="road-Medium" aria-pressed="false">道路 中</button>
      <button type="button" data-tool="road-Large" aria-pressed="false">道路 大</button>
      <button type="button" data-tool="upgrade-Small" aria-pressed="false">小に変える</button>
      <button type="button" data-tool="upgrade-Medium" aria-pressed="false">中に変える</button>
      <button type="button" data-tool="upgrade-Large" aria-pressed="false">大に変える</button>
      <button type="button" data-tool="bulldoze" aria-pressed="false">ブルドーザ</button>
      <button type="button" data-tool="zone-Residential" aria-pressed="false">住宅</button>
      <button type="button" data-tool="zone-Commercial" aria-pressed="false">商業</button>
      <button type="button" data-tool="zone-Industrial" aria-pressed="false">工業</button>
      <button type="button" data-tool="zone-Office" aria-pressed="false">オフィス</button>
      <button type="button" data-tool="zone-Clear" aria-pressed="false">区画を消す</button>
      <button type="button" data-tool="service-PowerPlant" aria-pressed="false">発電所</button>
      <button type="button" data-tool="service-WaterPump" aria-pressed="false">浄水場</button>
      <button type="button" data-tool="signal-on" aria-pressed="false">信号を置く</button>
      <button type="button" data-tool="signal-off" aria-pressed="false">信号を外す</button>
      <button type="button" data-tool="buy" aria-pressed="false">土地を買う</button>
      <div id="layers" title="データレイヤー"></div>
      <span id="tool-info"></span>
      <span id="tool-message" aria-live="polite"></span>
    </div>
    <details id="legend">
      <summary>凡例</summary>
      <div id="legend-body"></div>
    </details>
    <style>
      /* 左下に置く。左上の #overlay は縦に伸ばすと地図のクリックを隠すので、広げたときも下から上へ伸びる場所にする */
      #finance {
        position: fixed;
        left: 8px;
        bottom: calc(var(--toolbar-h, 48px) + 8px);
        width: 17em;
        max-height: 50vh;
        padding: 4px 8px;
        overflow-y: auto;
        font-size: 13px;
        background: rgb(255 255 255 / 90%);
        border-radius: 4px;
      }
      #finance summary {
        cursor: pointer;
        font-weight: bold;
      }
      #finance.deficit summary {
        color: #b00020;
      }
      #finance h3 {
        margin: 6px 0 2px;
        font-size: 12px;
      }
      #finance .finance-row {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #finance .finance-row > :first-child {
        flex: 1;
      }
      #finance .finance-rate {
        min-width: 3.5em;
        text-align: center;
      }
      #finance .finance-amount {
        min-width: 5em;
        text-align: right;
      }
      #finance .finance-net {
        justify-content: space-between;
        margin-top: 4px;
        padding-top: 2px;
        font-weight: bold;
        border-top: 1px solid #888;
      }
      #finance.deficit .finance-net {
        color: #b00020;
      }
      #finance .finance-note {
        margin: 4px 0 0;
        font-size: 11px;
        color: #555;
      }
    </style>
    <details id="finance">
      <summary>収支</summary>
      <div data-finance-body></div>
    </details>
    <button type="button" id="feedback-open" hidden>フィードバック</button>
    <div id="dev-tools">
      <button type="button" data-tool="dev-walks" aria-pressed="false" hidden>歩く人を出す</button>
      <p id="dev-info"></p>
    </div>
    <dialog id="feedback">
      <form method="dialog">
        <p>気づいたことを書く。画面、状態、これまでの操作の記録と一緒に保存する。</p>
        <textarea id="feedback-note"></textarea>
        <p id="feedback-result" aria-live="polite"></p>
        <button type="submit" id="feedback-send">送る</button>
        <button type="submit" value="close" formnovalidate>閉じる</button>
      </form>
    </dialog>
    <style>
      /* 右下の凡例と重ならないよう、右上のフィードバックのボタンの下に置く */
      #inspector {
        position: fixed;
        right: 8px;
        top: calc(var(--hudbar-h, 30px) + 116px);
        min-width: 16em;
        padding: 4px 8px 8px;
        font-size: 14px;
        background: rgb(255 255 255 / 90%);
        border-radius: 4px;
      }
      #inspector[hidden] {
        display: none;
      }
      #inspector header {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        font-weight: bold;
      }
      #inspector dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        margin: 4px 0 0;
      }
      #inspector dt {
        color: #555;
      }
      #inspector dd {
        margin: 0;
        text-align: right;
      }
    </style>
    <aside id="inspector" hidden>
      <header>
        <span data-inspector-title aria-live="polite"></span>
        <button type="button" data-inspector-close aria-label="閉じる">×</button>
      </header>
      <dl data-inspector-rows></dl>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
