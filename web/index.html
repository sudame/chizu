<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chizu</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1f;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #map:not([data-tool="none"]) {
        cursor: crosshair;
      }
      #toolbar {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 4px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
        white-space: nowrap;
      }
      #toolbar button[aria-pressed="true"] {
        background: #2d6cdf;
        color: #fff;
      }
      #tool-info,
      #tool-message {
        min-width: 10em;
        font-size: 14px;
      }
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        background: rgb(255 255 255 / 85%);
        border-radius: 4px;
      }
      #status {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="map" data-tool="none"></canvas>
    <div id="overlay">
      <p id="status" data-state="loading">WASM を読み込んでいる</p>
      <canvas id="hud" width="480" height="96"></canvas>
      <div id="controls">
        <button type="button" id="pause">一時停止</button>
        <button type="button" data-speed="1">1 倍</button>
        <button type="button" data-speed="4">4 倍</button>
        <button type="button" data-speed="16">16 倍</button>
        <button type="button" data-speed="48">48 倍</button>
      </div>
    </div>
    <div id="toolbar">
      <button type="button" data-tool="none" aria-pressed="true">見る</button>
      <button type="button" data-tool="road-Small" aria-pressed="false">道路 小</button>
      <button type="button" data-tool="road-Medium" aria-pressed="false">道路 中</button>
      <button type="button" data-tool="road-Large" aria-pressed="false">道路 大</button>
      <button type="button" data-tool="bulldoze" aria-pressed="false">ブルドーザ</button>
      <button type="button" data-tool="buy" aria-pressed="false">土地を買う</button>
      <span id="tool-info"></span>
      <span id="tool-message" aria-live="polite"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
